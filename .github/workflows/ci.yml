name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  test:
    name: Test (envtest ${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "1.29 floor"
            target: test-floor
          - name: latest
            target: test
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run ${{ matrix.target }}
        run: make ${{ matrix.target }}

  build:
    name: Build manager binary
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make build

  bundle:
    name: OLM bundle
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install operator-sdk (checksum-verified)
        env:
          OPERATOR_SDK_VERSION: v1.42.3
        run: |
          set -euo pipefail
          base="https://github.com/operator-framework/operator-sdk/releases/download/${OPERATOR_SDK_VERSION}"
          curl -sSLO "${base}/checksums.txt"
          curl -sSLO "${base}/operator-sdk_linux_amd64"
          grep ' operator-sdk_linux_amd64$' checksums.txt | sha256sum -c -
          chmod +x operator-sdk_linux_amd64
          sudo mv operator-sdk_linux_amd64 /usr/local/bin/operator-sdk
          rm -f checksums.txt

      - name: Install opm (checksum-verified)
        env:
          OPM_VERSION: v1.74.0
        run: |
          set -euo pipefail
          base="https://github.com/operator-framework/operator-registry/releases/download/${OPM_VERSION}"
          curl -sSLO "${base}/checksums.txt"
          curl -sSLO "${base}/linux-amd64-opm"
          grep ' linux-amd64-opm$' checksums.txt | sha256sum -c -
          chmod +x linux-amd64-opm
          sudo mv linux-amd64-opm /usr/local/bin/opm
          rm -f checksums.txt

      - name: Generate bundle
        run: make bundle

      - name: Validate bundle (default + operatorframework + operatorhub)
        run: |
          operator-sdk bundle validate ./bundle
          operator-sdk bundle validate ./bundle --select-optional suite=operatorframework
          operator-sdk bundle validate ./bundle --select-optional name=operatorhub

      - name: Fail if the checked-in bundle/manifests are stale
        # operator-sdk stamps a fresh createdAt into the CSV on every run, so that one line
        # is ignored; any other difference means the committed bundle is out of date.
        run: |
          git diff --exit-code -I '^ *createdAt: ' -- bundle/ config/manifests/

  image:
    name: Build container image
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build manager image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: uddi-operator:ci
