name: Release

# Tag pushes (v1.2.3) build and publish the multi-arch manager image, then the OLM bundle
# and file-based catalog images, all derived from the tag.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

env:
  IMAGE_TAG_BASE: quay.io/ingmarorg/uddi-operator

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Derive VERSION from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install operator-sdk (checksum-verified)
        env:
          OPERATOR_SDK_VERSION: v1.42.3
        run: |
          set -euo pipefail
          base="https://github.com/operator-framework/operator-sdk/releases/download/${OPERATOR_SDK_VERSION}"
          curl -sSLO "${base}/checksums.txt"
          curl -sSLO "${base}/operator-sdk_linux_amd64"
          grep ' operator-sdk_linux_amd64$' checksums.txt | sha256sum -c -
          chmod +x operator-sdk_linux_amd64
          sudo mv operator-sdk_linux_amd64 /usr/local/bin/operator-sdk
          rm -f checksums.txt

      - name: Install opm (checksum-verified)
        env:
          OPM_VERSION: v1.74.0
        run: |
          set -euo pipefail
          base="https://github.com/operator-framework/operator-registry/releases/download/${OPM_VERSION}"
          curl -sSLO "${base}/checksums.txt"
          curl -sSLO "${base}/linux-amd64-opm"
          grep ' linux-amd64-opm$' checksums.txt | sha256sum -c -
          chmod +x linux-amd64-opm
          sudo mv linux-amd64-opm /usr/local/bin/opm
          rm -f checksums.txt

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push the manager image (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          tags: |
            ${{ env.IMAGE_TAG_BASE }}:${{ github.ref_name }}
            ${{ env.IMAGE_TAG_BASE }}:latest

      - name: Build and push the OLM bundle image
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: make bundle bundle-build bundle-push

      - name: Build and push the file-based catalog image
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: make catalog-build catalog-push
