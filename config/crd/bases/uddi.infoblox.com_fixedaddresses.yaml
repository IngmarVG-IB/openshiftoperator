---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: fixedaddresses.uddi.infoblox.com
spec:
  group: uddi.infoblox.com
  names:
    kind: FixedAddress
    listKind: FixedAddressList
    plural: fixedaddresses
    shortNames:
    - uddifixed
    singular: fixedaddress
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .spec.address
      name: Address
      type: string
    - jsonPath: .status.id
      name: ID
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: FixedAddress is a Universal DDI DHCP fixed address reservation.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              FixedAddressSpec describes a Universal DDI DHCP fixed address.
              Natural key for adoption: address plus ip space.
            properties:
              address:
                description: Address to reserve, for example "10.0.10.50". Immutable.
                maxLength: 45
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: address is immutable
                  rule: self == oldSelf
              comment:
                description: Comment stored on the Universal DDI object.
                maxLength: 1024
                type: string
              connectionRef:
                description: |-
                  ConnectionRef names the Connection providing credentials. Empty means the
                  Connection called "default" in this namespace.
                properties:
                  name:
                    description: Name of the Connection in this namespace. Defaults
                      to "default".
                    maxLength: 253
                    type: string
                type: object
              dhcpOptions:
                description: DHCPOptions applied to this reservation.
                items:
                  description: |-
                    DHCPOption maps to the Universal DDI ipam.OptionItem. Option codes and groups are
                    opaque Universal DDI resource ids in v1alpha1; lookup by name is a later convenience.
                  properties:
                    group:
                      description: |-
                        Group is a Universal DDI option group id, for example "dhcp/option_group/<uuid>".
                        Required when type is "group".
                      maxLength: 256
                      type: string
                    optionCode:
                      description: |-
                        OptionCode is a Universal DDI option code id, for example "dhcp/option_code/<uuid>".
                        Required when type is "option".
                      maxLength: 256
                      type: string
                    optionValue:
                      description: OptionValue is the value for the option code.
                      maxLength: 4096
                      type: string
                    type:
                      default: option
                      description: Type selects a single option or an option group.
                      enum:
                      - option
                      - group
                      type: string
                  required:
                  - type
                  type: object
                  x-kubernetes-validations:
                  - message: type option requires optionCode, type group requires
                      group
                    rule: 'self.type == ''option'' ? has(self.optionCode) : has(self.group)'
                type: array
                x-kubernetes-list-type: atomic
              disableDhcp:
                description: DisableDHCP turns the reservation into an exclusion without
                  deleting it.
                type: boolean
              hostname:
                description: Hostname handed to the client.
                maxLength: 256
                type: string
              lifecycle:
                description: Lifecycle controls adoption and deletion.
                properties:
                  adoptExisting:
                    default: false
                    description: |-
                      AdoptExisting allows taking over an existing Universal DDI object that matches the
                      natural key but does not carry this operator's ownership tags. When false such an
                      object is reported as a conflict (Ready=False/AlreadyExists).
                    type: boolean
                  deletionPolicy:
                    default: Delete
                    description: DeletionPolicy decides whether deleting the CR also
                      deletes the Universal DDI object.
                    enum:
                    - Delete
                    - Orphan
                    type: string
                type: object
              matchType:
                default: mac
                description: MatchType selects how the DHCP client is identified.
                  Immutable.
                enum:
                - mac
                - client_text
                - client_hex
                - relay_text
                - relay_hex
                - duid
                type: string
                x-kubernetes-validations:
                - message: matchType is immutable
                  rule: self == oldSelf
              matchValue:
                description: MatchValue is the client identifier, for example a MAC
                  address.
                maxLength: 256
                minLength: 1
                type: string
              name:
                description: Name of the reservation in Universal DDI.
                maxLength: 256
                type: string
              spaceRef:
                description: SpaceRef names the IPSpace CR or a Universal DDI ip space
                  id.
                properties:
                  id:
                    description: ID is a Universal DDI resource id, for example "dns/view/2c1a...".
                    maxLength: 256
                    type: string
                  name:
                    description: Name of an object-layer CR in this namespace.
                    maxLength: 253
                    type: string
                type: object
                x-kubernetes-validations:
                - message: exactly one of name or id must be set
                  rule: has(self.name) != has(self.id)
              tags:
                additionalProperties:
                  type: string
                description: |-
                  Tags merged onto the Universal DDI object. Ownership tags always win, then the
                  Connection's defaultTags, then these.
                type: object
            required:
            - address
            - matchType
            - matchValue
            - spaceRef
            type: object
          status:
            description: FixedAddressStatus reports the observed state of the fixed
              address.
            properties:
              address:
                description: Address observed in Universal DDI.
                type: string
              appliedTags:
                description: |-
                  AppliedTags lists, sorted, the tag keys the operator wrote on the Universal DDI
                  object at the last successful sync: the ownership tags, the Connection's
                  defaultTags and spec.tags. It is written together with Synced=True for
                  observedGeneration. On the next sync a key listed here that is no longer wanted
                  is removed from the object; keys the operator never wrote are left alone, and an
                  empty list removes nothing.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              conditions:
                description: Conditions hold Ready and Synced.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              id:
                description: ID is the Universal DDI resource id, for example "ipam/subnet/<uuid>".
                type: string
              ipSpace:
                description: IPSpace is the Universal DDI ip space id.
                type: string
              lastSyncTime:
                description: LastSyncTime is when the Universal DDI object was last
                  read or written.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the metadata.generation the status
                  was last computed from.
                format: int64
                type: integer
              parent:
                description: Parent is the Universal DDI subnet id containing the
                  address.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
