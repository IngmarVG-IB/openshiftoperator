---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: addresses.uddi.infoblox.com
spec:
  group: uddi.infoblox.com
  names:
    kind: Address
    listKind: AddressList
    plural: addresses
    shortNames:
    - uddiaddr
    singular: address
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.address
      name: Address
      type: string
    - jsonPath: .status.id
      name: ID
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Address is a Universal DDI address reservation.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AddressSpec describes a Universal DDI address reservation.
              Natural key for adoption: address plus space.
            properties:
              address:
                description: |-
                  Address to reserve, for example "10.0.10.7". Omit to allocate the next available
                  address from nextAvailableFrom. Immutable.
                maxLength: 45
                type: string
              comment:
                description: Comment stored on the Universal DDI object.
                maxLength: 1024
                type: string
              connectionRef:
                description: |-
                  ConnectionRef names the Connection providing credentials. Empty means the
                  Connection called "default" in this namespace.
                properties:
                  name:
                    description: Name of the Connection in this namespace. Defaults
                      to "default".
                    maxLength: 253
                    type: string
                type: object
              hwaddr:
                description: HWAddr is the MAC address associated with the reservation.
                maxLength: 64
                type: string
              interface:
                description: Interface name associated with the reservation.
                maxLength: 256
                type: string
              lifecycle:
                description: Lifecycle controls adoption and deletion.
                properties:
                  adoptExisting:
                    default: false
                    description: |-
                      AdoptExisting allows taking over an existing Universal DDI object that matches the
                      natural key but does not carry this operator's ownership tags. When false such an
                      object is reported as a conflict (Ready=False/AlreadyExists).
                    type: boolean
                  deletionPolicy:
                    default: Delete
                    description: DeletionPolicy decides whether deleting the CR also
                      deletes the Universal DDI object.
                    enum:
                    - Delete
                    - Orphan
                    type: string
                type: object
              names:
                description: Names attached to the address.
                items:
                  description: |-
                    AddressName is one entry of the Universal DDI address names list. Both fields are
                    required by the API. Type is an open string; "user" is the only value confirmed to be
                    writable, so it is the default and there is no enum.
                  properties:
                    name:
                      description: Name of the address.
                      maxLength: 256
                      minLength: 1
                      type: string
                    type:
                      default: user
                      description: |-
                        Type of the name, for example "user". Defaults to "user" when omitted; note that
                        this default only takes effect when the field is left out of the submitted object
                        entirely (for example a YAML manifest with no type: key) and not when a client
                        marshals an explicit empty string, since only a genuinely absent field is filled in
                        by CRD defaulting.
                      maxLength: 64
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              nextAvailableFrom:
                description: NextAvailableFrom selects the parent to allocate from.
                  Immutable.
                properties:
                  addressBlockRef:
                    description: AddressBlockRef names an AddressBlock CR or a Universal
                      DDI address block id.
                    properties:
                      id:
                        description: ID is a Universal DDI resource id, for example
                          "dns/view/2c1a...".
                        maxLength: 256
                        type: string
                      name:
                        description: Name of an object-layer CR in this namespace.
                        maxLength: 253
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: exactly one of name or id must be set
                      rule: has(self.name) != has(self.id)
                  rangeRef:
                    description: RangeRef names a Range CR or a Universal DDI range
                      id.
                    properties:
                      id:
                        description: ID is a Universal DDI resource id, for example
                          "dns/view/2c1a...".
                        maxLength: 256
                        type: string
                      name:
                        description: Name of an object-layer CR in this namespace.
                        maxLength: 253
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: exactly one of name or id must be set
                      rule: has(self.name) != has(self.id)
                  subnetRef:
                    description: SubnetRef names a Subnet CR or a Universal DDI subnet
                      id.
                    properties:
                      id:
                        description: ID is a Universal DDI resource id, for example
                          "dns/view/2c1a...".
                        maxLength: 256
                        type: string
                      name:
                        description: Name of an object-layer CR in this namespace.
                        maxLength: 253
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: exactly one of name or id must be set
                      rule: has(self.name) != has(self.id)
                type: object
                x-kubernetes-validations:
                - message: exactly one of subnetRef, rangeRef or addressBlockRef must
                    be set
                  rule: '[has(self.subnetRef), has(self.rangeRef), has(self.addressBlockRef)].filter(x,
                    x).size() == 1'
              spaceRef:
                description: SpaceRef names the IPSpace CR or a Universal DDI ip space
                  id.
                properties:
                  id:
                    description: ID is a Universal DDI resource id, for example "dns/view/2c1a...".
                    maxLength: 256
                    type: string
                  name:
                    description: Name of an object-layer CR in this namespace.
                    maxLength: 253
                    type: string
                type: object
                x-kubernetes-validations:
                - message: exactly one of name or id must be set
                  rule: has(self.name) != has(self.id)
              tags:
                additionalProperties:
                  type: string
                description: |-
                  Tags merged onto the Universal DDI object. Ownership tags always win, then the
                  Connection's defaultTags, then these.
                type: object
            required:
            - spaceRef
            type: object
            x-kubernetes-validations:
            - message: exactly one of address or nextAvailableFrom must be set
              rule: has(self.address) != has(self.nextAvailableFrom)
            - message: 'address is immutable: an address allocated from nextAvailableFrom
                must keep spec.address empty, and a set address must not change'
              rule: (!has(oldSelf.address) && !has(self.address)) || (has(oldSelf.address)
                && has(self.address) && oldSelf.address == self.address)
            - message: 'nextAvailableFrom is immutable: it may not be added, removed
                or changed after creation'
              rule: (!has(oldSelf.nextAvailableFrom) && !has(self.nextAvailableFrom))
                || (has(oldSelf.nextAvailableFrom) && has(self.nextAvailableFrom)
                && oldSelf.nextAvailableFrom == self.nextAvailableFrom)
          status:
            description: |-
              AddressStatus reports the observed state of the address. status.address is the
              allocated address and the value consumers read.
            properties:
              address:
                description: Address allocated or reserved in Universal DDI.
                type: string
              appliedTags:
                description: |-
                  AppliedTags lists, sorted, the tag keys the operator wrote on the Universal DDI
                  object at the last successful sync: the ownership tags, the Connection's
                  defaultTags and spec.tags. It is written together with Synced=True for
                  observedGeneration. On the next sync a key listed here that is no longer wanted
                  is removed from the object; keys the operator never wrote are left alone, and an
                  empty list removes nothing.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              conditions:
                description: Conditions hold Ready and Synced.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              id:
                description: ID is the Universal DDI resource id, for example "ipam/subnet/<uuid>".
                type: string
              lastSyncTime:
                description: LastSyncTime is when the Universal DDI object was last
                  read or written.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the metadata.generation the status
                  was last computed from.
                format: int64
                type: integer
              parent:
                description: Parent is the Universal DDI subnet or range id containing
                  the address.
                type: string
              space:
                description: Space is the Universal DDI ip space id.
                type: string
              state:
                description: State reported by Universal DDI, for example "used" or
                  "free".
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
