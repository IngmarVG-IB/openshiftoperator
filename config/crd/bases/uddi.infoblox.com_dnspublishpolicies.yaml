---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: dnspublishpolicies.uddi.infoblox.com
spec:
  group: uddi.infoblox.com
  names:
    kind: DNSPublishPolicy
    listKind: DNSPublishPolicyList
    plural: dnspublishpolicies
    shortNames:
    - uddipublish
    singular: dnspublishpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.published
      name: Published
      type: integer
    - jsonPath: .status.ready
      name: Ready-count
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DNSPublishPolicy turns OpenShift Routes, Ingresses and LoadBalancer Services into
          Universal DDI DNS Records.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              DNSPublishPolicySpec describes which OpenShift objects a policy publishes to
              Universal DDI DNS. Selected source objects are turned into Records in the matching
              zoneRefs; see DESIGN.md section 4.7 for the full pipeline.
            properties:
              compatibility:
                description: Compatibility switches on interoperability with other
                  DNS publishers.
                properties:
                  externalDNS:
                    description: |-
                      ExternalDNS also reads the external-dns.alpha.kubernetes.io/hostname, /ttl and
                      /target annotations as fallbacks on every source kind. The uddi.infoblox.com
                      annotation wins when both are set, so existing external-dns users can move without
                      relabelling.
                    type: boolean
                type: object
              connectionRef:
                description: |-
                  ConnectionRef names the Connection used by every Record this policy generates.
                  Empty means the Connection called "default" in this namespace.
                properties:
                  name:
                    description: Name of the Connection in this namespace. Defaults
                      to "default".
                    maxLength: 253
                    type: string
                type: object
              createPtr:
                description: |-
                  CreatePtr sets createPtr on every A and AAAA Record this policy generates, so the
                  matching PTR record is created too. CNAME Records never carry it.
                type: boolean
              dnsRecordNamespace:
                default: openshift-ingress-operator
                description: |-
                  DNSRecordNamespace is the namespace the DNSRecord source reads, matched by selector.
                  Defaults to the namespace the OpenShift ingress operator creates its records in.
                maxLength: 63
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              nodeAddressType:
                default: InternalIP
                description: NodeAddressType selects which Node addresses the Node
                  source publishes.
                enum:
                - InternalIP
                - ExternalIP
                type: string
              recordLifecycle:
                description: RecordLifecycle is copied onto every generated Record's
                  spec.lifecycle.
                properties:
                  adoptExisting:
                    default: false
                    description: |-
                      AdoptExisting allows taking over an existing Universal DDI object that matches the
                      natural key but does not carry this operator's ownership tags. When false such an
                      object is reported as a conflict (Ready=False/AlreadyExists).
                    type: boolean
                  deletionPolicy:
                    default: Delete
                    description: DeletionPolicy decides whether deleting the CR also
                      deletes the Universal DDI object.
                    enum:
                    - Delete
                    - Orphan
                    type: string
                type: object
              selector:
                description: |-
                  Selector selects the source objects in this namespace. Empty selects every
                  object of the configured source kinds.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              sources:
                default:
                - Route
                - Ingress
                - Service
                description: |-
                  Sources selects which kinds of objects this policy publishes. Defaults to Route,
                  Ingress and Service; Service means type LoadBalancer. Node, DNSRecord and HTTPRoute
                  are opt-in.
                items:
                  description: SourceKind names a kind of Kubernetes object DNSPublishPolicy
                    can publish from.
                  enum:
                  - Route
                  - Ingress
                  - Service
                  - Node
                  - DNSRecord
                  - HTTPRoute
                  type: string
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              tags:
                additionalProperties:
                  type: string
                description: Tags are merged into every generated Record's spec.tags.
                type: object
              target:
                description: Target selects the DNS record type generated for matched
                  hostnames.
                properties:
                  addresses:
                    description: |-
                      Addresses are static A/AAAA targets: used by mode A, and by mode Auto for Routes.
                      Each entry must be a literal IPv4 or IPv6 address.
                    items:
                      pattern: ^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)(\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)){3}|(([0-9a-fA-F]{1,4}:){7}[0-9a-fA-F]{1,4}|([0-9a-fA-F]{1,4}:){1,7}:|([0-9a-fA-F]{1,4}:){1,6}:[0-9a-fA-F]{1,4}|([0-9a-fA-F]{1,4}:){1,5}(:[0-9a-fA-F]{1,4}){1,2}|([0-9a-fA-F]{1,4}:){1,4}(:[0-9a-fA-F]{1,4}){1,3}|([0-9a-fA-F]{1,4}:){1,3}(:[0-9a-fA-F]{1,4}){1,4}|([0-9a-fA-F]{1,4}:){1,2}(:[0-9a-fA-F]{1,4}){1,5}|[0-9a-fA-F]{1,4}:((:[0-9a-fA-F]{1,4}){1,6})|:((:[0-9a-fA-F]{1,4}){1,7}|:)))$
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                  canonicalHostname:
                    description: CanonicalHostname overrides the admitted Route's
                      routerCanonicalHostname.
                    maxLength: 256
                    type: string
                  mode:
                    default: Auto
                    description: Mode selects CNAME, A/AAAA, or lets the source decide
                      (Auto).
                    enum:
                    - Auto
                    - CNAME
                    - A
                    type: string
                type: object
              ttl:
                default: 300
                description: |-
                  TTL is the default TTL in seconds for generated Records, used when a source does
                  not carry its own ttl override.
                format: int32
                minimum: 1
                type: integer
              zoneRefs:
                description: |-
                  ZoneRefs are the zones considered for the generated Records: AuthZone CRs in this
                  namespace (name), or Universal DDI zones addressed directly (id plus fqdn).
                items:
                  description: |-
                    ZoneRef is one zone a DNSPublishPolicy may publish into. It names either an AuthZone CR
                    in the policy namespace (name), or a Universal DDI zone directly (id plus fqdn, both
                    required together). A zone given by id counts as ready and resolved, is matched through
                    the given fqdn, and the generated Records reference it as zoneRef.id, so many namespaces
                    can publish into one zone that is adopted once, in a platform namespace.
                  properties:
                    fqdn:
                      description: |-
                        FQDN of the zone behind id, a canonical DNS name with or without the trailing dot.
                        Hostnames are matched against it, so it must equal the zone's real fqdn.
                      maxLength: 256
                      minLength: 1
                      pattern: ^([A-Za-z0-9_]([-A-Za-z0-9_]{0,61}[A-Za-z0-9_])?)(\.[A-Za-z0-9_]([-A-Za-z0-9_]{0,61}[A-Za-z0-9_])?)*\.?$
                      type: string
                    id:
                      description: |-
                        ID is a Universal DDI auth zone id, for example "dns/auth_zone/2c1a...". Set it
                        together with fqdn.
                      maxLength: 256
                      minLength: 1
                      type: string
                    name:
                      description: Name of an AuthZone CR in this namespace.
                      maxLength: 253
                      minLength: 1
                      type: string
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one of name or id must be set
                    rule: has(self.name) != has(self.id)
                  - message: fqdn is required with id, and only valid with id
                    rule: has(self.id) == has(self.fqdn)
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
            required:
            - zoneRefs
            type: object
          status:
            description: DNSPublishPolicyStatus reports the observed state of a DNSPublishPolicy.
            properties:
              conditions:
                description: Conditions hold Ready and ZonesResolved.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the metadata.generation the status
                  was last computed from.
                format: int64
                type: integer
              published:
                description: Published is the number of desired Records currently
                  applied.
                format: int32
                type: integer
              ready:
                description: Ready is, of those, the number reporting Ready=True.
                format: int32
                type: integer
              skipped:
                description: |-
                  Skipped lists hostnames not published and why. Bounded and sorted by source then
                  hostname.
                items:
                  description: |-
                    SkippedSource is one hostname (or a whole source, when Hostname is empty) that a
                    DNSPublishPolicy did not publish, and why.
                  properties:
                    hostname:
                      description: Hostname that was skipped. Empty means the whole
                        source was skipped.
                      maxLength: 256
                      type: string
                    message:
                      description: Message is a human-readable explanation.
                      maxLength: 512
                      type: string
                    reason:
                      description: Reason is a short machine-readable skip reason,
                        for example NoMatchingZone.
                      maxLength: 64
                      type: string
                    source:
                      description: Source identifying the object, rendered as "Kind/name".
                      maxLength: 256
                      type: string
                  type: object
                maxItems: 50
                type: array
                x-kubernetes-list-type: atomic
            type: object
        type: object
        x-kubernetes-validations:
        - message: the policy name becomes a label value on every generated Record,
            so it is limited to 63 characters
          rule: size(self.metadata.name) <= 63
    served: true
    storage: true
    subresources:
      status: {}
