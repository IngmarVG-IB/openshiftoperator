# This NetworkPolicy allows ingress traffic to the metrics endpoint
# from the OpenShift monitoring namespaces (user-workload monitoring and system monitoring).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/name: uddi-operator
    app.kubernetes.io/managed-by: kustomize
  name: allow-metrics-traffic
  namespace: system
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: uddi-operator
  policyTypes:
    - Ingress
  ingress:
    # Allow metrics scraping from OpenShift user-workload monitoring
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: openshift-user-workload-monitoring
      ports:
        - port: 8443
          protocol: TCP
    # Allow metrics scraping from OpenShift system monitoring
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: openshift-monitoring
      ports:
        - port: 8443
          protocol: TCP
