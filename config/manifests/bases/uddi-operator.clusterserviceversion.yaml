      version: v1alpha1
    - description: AuthZone is a Universal DDI authoritative DNS zone.
      displayName: Auth Zone
      kind: AuthZone
      name: authzones.uddi.infoblox.com
      version: v1alpha1
    - description: Connection holds the credentials and client settings for one Universal
