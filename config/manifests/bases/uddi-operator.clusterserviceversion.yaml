      displayName: Connection
      kind: Connection
      name: connections.uddi.infoblox.com
      version: v1alpha1
    - description: |-
        DNSPublishPolicy turns OpenShift Routes, Ingresses and LoadBalancer Services into
        Universal DDI DNS Records.
      displayName: DNSPublish Policy
      kind: DNSPublishPolicy
      name: dnspublishpolicies.uddi.infoblox.com
      version: v1alpha1
    - description: FixedAddress is a Universal DDI DHCP fixed address reservation.
      displayName: Fixed Address
      kind: FixedAddress
      name: fixedaddresses.uddi.infoblox.com
      version: v1alpha1
    - description: |-
        HostRegistrationPolicy registers selected Nodes in Universal DDI as an IPAM Address
        or a DHCP FixedAddress.
      displayName: Host Registration Policy
      kind: HostRegistrationPolicy
      name: hostregistrationpolicies.uddi.infoblox.com
      version: v1alpha1
    - description: |-
        IPAllocationPolicy allocates Universal DDI IPAM addresses for LoadBalancer
        Services, one per IP family, and OVN-Kubernetes EgressIPs, and writes them back as a
        Service annotation, spec.loadBalancerIP or the EgressIP's spec.egressIPs.
      displayName: IPAllocation Policy
      kind: IPAllocationPolicy
      name: ipallocationpolicies.uddi.infoblox.com
      version: v1alpha1
    - description: IPSpace is a Universal DDI IP space.
      displayName: IPSpace
      kind: IPSpace
      name: ipspaces.uddi.infoblox.com
      version: v1alpha1
    - description: Range is a Universal DDI address range.
      displayName: Range
      kind: Range
      name: ranges.uddi.infoblox.com
      version: v1alpha1
    - description: Record is a Universal DDI DNS resource record.
      displayName: Record
      kind: Record
      name: records.uddi.infoblox.com
      version: v1alpha1
    - description: Subnet is a Universal DDI subnet.
      displayName: Subnet
      kind: Subnet
      name: subnets.uddi.infoblox.com
      version: v1alpha1
    - description: View is a Universal DDI DNS view.
      displayName: View
      kind: View
      name: views.uddi.infoblox.com
      version: v1alpha1
  description: |-
    The Universal DDI Operator shims OpenShift to [Infoblox Universal
    DDI](https://www.infoblox.com/products/universal-ddi/), the cloud-delivered DNS, DHCP
    and IPAM platform behind the Infoblox Cloud Services Portal.

    This is an independent community project in alpha. It is not affiliated with, endorsed
    by or supported by Infoblox Inc. or Red Hat, Inc.

    ## Object layer

    Universal DDI objects are modelled one-to-one as namespaced custom resources under the
    `uddi.infoblox.com` API group, covering DNS (View, AuthZone, Record), IPAM (IPSpace,
    AddressBlock, Subnet, Range, Address) and DHCP (FixedAddress). Reconciling a custom
    resource creates, updates, adopts or deletes the matching object in Universal DDI, so a
    GitOps or `oc apply` workflow drives DNS records, IP allocation and DHCP reservations the
    same way it drives any other OpenShift object.

    ## Connections and credentials

    Every namespace that owns object-layer resources also owns a `Connection` custom
    resource, which points at a Secret holding the tenant's Universal DDI API key. This
    keeps credentials scoped per namespace/tenant rather than cluster-wide, so multiple
    teams or sandboxes can share a cluster safely.

    ## Ownership and lifecycle

    Objects created or adopted by the operator are tagged with the owning cluster, the
    owning custom resource and its Kubernetes UID. The operator only ever creates, modifies
    or deletes objects that carry its own ownership tags: pre-existing objects can be
    adopted explicitly (`lifecycle.adoptExisting: true`), and each object's
    `lifecycle.deletionPolicy` (`Delete`, the default, or `Orphan`) controls whether deleting
    the custom resource also deletes the underlying Universal DDI object.
