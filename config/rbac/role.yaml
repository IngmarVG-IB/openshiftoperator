---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  - nodes
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - config.openshift.io
  resources:
  - clusterversions
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - gateways
  - httproutes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ingress.operator.openshift.io
  resources:
  - dnsrecords
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - nmstate.io
  resources:
  - nodenetworkstates
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - route.openshift.io
  resources:
  - routes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - uddi.infoblox.com
  resources:
  - addressblocks
  - addresses
  - authzones
  - connections
  - dnspublishpolicies
  - fixedaddresses
  - hostregistrationpolicies
  - ipallocationpolicies
  - ipspaces
  - ranges
  - records
  - subnets
  - views
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - uddi.infoblox.com
  resources:
  - addressblocks/finalizers
  - addresses/finalizers
  - authzones/finalizers
  - connections/finalizers
  - dnspublishpolicies/finalizers
  - fixedaddresses/finalizers
  - hostregistrationpolicies/finalizers
  - ipallocationpolicies/finalizers
  - ipspaces/finalizers
  - ranges/finalizers
  - records/finalizers
  - subnets/finalizers
  - views/finalizers
  verbs:
  - update
- apiGroups:
  - uddi.infoblox.com
  resources:
  - addressblocks/status
  - addresses/status
  - authzones/status
  - connections/status
  - dnspublishpolicies/status
  - fixedaddresses/status
  - hostregistrationpolicies/status
  - ipallocationpolicies/status
  - ipspaces/status
  - ranges/status
  - records/status
  - subnets/status
  - views/status
  verbs:
  - get
  - patch
  - update
