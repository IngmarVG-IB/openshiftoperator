# This rule is not used by the project uddi-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over uddi.infoblox.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: uddi-operator
    app.kubernetes.io/managed-by: kustomize
  name: ipallocationpolicy-admin-role
rules:
- apiGroups:
  - uddi.infoblox.com
  resources:
  - ipallocationpolicies
  verbs:
  - '*'
- apiGroups:
  - uddi.infoblox.com
  resources:
  - ipallocationpolicies/status
  verbs:
  - get
