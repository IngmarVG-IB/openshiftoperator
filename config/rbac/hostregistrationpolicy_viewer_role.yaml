# This rule is not used by the project uddi-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to uddi.infoblox.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: uddi-operator
    app.kubernetes.io/managed-by: kustomize
  name: hostregistrationpolicy-viewer-role
rules:
- apiGroups:
  - uddi.infoblox.com
  resources:
  - hostregistrationpolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - uddi.infoblox.com
  resources:
  - hostregistrationpolicies/status
  verbs:
  - get
