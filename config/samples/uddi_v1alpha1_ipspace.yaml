# A Universal DDI IP space. Natural key for adoption: spec.name, which defaults to
# metadata.name.
apiVersion: uddi.infoblox.com/v1alpha1
kind: IPSpace
metadata:
  labels:
    app.kubernetes.io/name: uddi-operator
    app.kubernetes.io/managed-by: kustomize
  name: corp
spec:
  connectionRef:
    name: default
  name: corp
  comment: Corporate IP space managed by uddi-operator
  tags:
    team: platform
  lifecycle:
    adoptExisting: false
    deletionPolicy: Delete
