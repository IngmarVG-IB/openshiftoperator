# A Universal DDI address range. Natural key for adoption: start plus end plus space.
# The parent subnet is derived by Universal DDI from start and end.
apiVersion: uddi.infoblox.com/v1alpha1
kind: Range
metadata:
  labels:
    app.kubernetes.io/name: uddi-operator
    app.kubernetes.io/managed-by: kustomize
  name: lb-pool
spec:
  connectionRef:
    name: default
  spaceRef:
    name: corp
  start: 10.0.10.100
  end: 10.0.10.199
  name: lb-pool
  comment: LoadBalancer IP pool managed by uddi-operator
  exclusionRanges:
    - start: 10.0.10.150
      end: 10.0.10.159
      comment: reserved
  tags:
    team: platform
