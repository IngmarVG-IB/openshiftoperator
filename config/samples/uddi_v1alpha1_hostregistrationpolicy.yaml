# Registers every worker Node's InternalIP in the "corp" IPSpace: a DHCP FixedAddress
# when the Node's MAC is known (from the uddi.infoblox.com/mac annotation or, failing
# that, NodeNetworkState, then Metal3 BareMetalHosts), otherwise a plain IPAM Address.
# A second registration per Node covers its storage network: the first Node address
# inside 10.20.0.0/16, registered as <node>-storage in the "storage" IPSpace.
apiVersion: uddi.infoblox.com/v1alpha1
kind: HostRegistrationPolicy
metadata:
  labels:
    app.kubernetes.io/name: uddi-operator
    app.kubernetes.io/managed-by: kustomize
  name: nodes
  namespace: uddi-system
spec:
  connectionRef:
    name: default
  selector:
    matchLabels:
      node-role.kubernetes.io/worker: ""
  spaceRef:
    name: corp
  addressType: InternalIP
  register:
    mode: Auto
    dhcpOptions: []
  macSource:
    nodeAnnotation: uddi.infoblox.com/mac
    nmstate:
      enabled: true
      interface: ""
    metal3:
      enabled: true
      namespace: openshift-machine-api
  additionalInterfaces:
    - name: storage
      cidr: 10.20.0.0/16
      spaceRef:
        name: storage
      hostnameSuffix: -storage
  tags:
    role: node
  lifecycle:
    deletionPolicy: Delete
