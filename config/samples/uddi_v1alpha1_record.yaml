# Natural key for adoption: zone plus name plus type plus rdata. "@" or an empty name
# means the zone apex.
apiVersion: uddi.infoblox.com/v1alpha1
kind: Record
metadata:
  labels:
    app.kubernetes.io/name: uddi-operator
    app.kubernetes.io/managed-by: kustomize
  name: www-a
spec:
  connectionRef:
    name: default
  zoneRef:
    name: apps-zone
  name: www
  type: A
  rdata:
    a:
      address: 192.0.2.10
  ttl: 300
  comment: Managed by uddi-operator
  tags:
    team: platform
