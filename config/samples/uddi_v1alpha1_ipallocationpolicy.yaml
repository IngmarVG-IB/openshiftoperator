# Allocates a Universal DDI address from the "lb-pool" Range for every LoadBalancer
# Service in this namespace labelled lb: uddi that also carries the
# uddi.infoblox.com/allocate: "true" annotation, and writes the result into MetalLB's
# metallb.io/loadBalancerIPs annotation. A dual-stack Service gets one address per IP
# family: its IPv6 address comes from the "lb-pool-v6" Range, and the annotation carries
# both addresses comma-separated. The pools are mirrored into MetalLB IPAddressPools
# (autoAssign false, usable by this namespace's Services only) in the operator's MetalLB
# namespace so MetalLB announces the assigned addresses; that needs this namespace in the
# operator's --cluster-target-namespaces.
apiVersion: uddi.infoblox.com/v1alpha1
kind: IPAllocationPolicy
metadata:
  labels:
    app.kubernetes.io/name: uddi-operator
    app.kubernetes.io/managed-by: kustomize
  name: lb
spec:
  connectionRef:
    name: default
  targets:
    - Service
  selector:
    matchLabels:
      lb: uddi
  requireAnnotation: true
  allocateFrom:
    rangeRef:
      name: lb-pool
  allocateFromIPv6:
    rangeRef:
      name: lb-pool-v6
  assignVia:
    mode: Annotation
    annotation: metallb.io/loadBalancerIPs
  metallb:
    mirrorPools: true
  tags:
    team: platform
  addressLifecycle:
    deletionPolicy: Delete
