# A Universal DDI address reservation. Natural key for adoption: address plus space.
# Next-available allocation: omit spec.address and name a parent instead, here the
# "lb-pool" Range sample. status.address is the allocated address and the value
# consumers read.
apiVersion: uddi.infoblox.com/v1alpha1
kind: Address
metadata:
  labels:
    app.kubernetes.io/name: uddi-operator
    app.kubernetes.io/managed-by: kustomize
  name: svc-web
spec:
  connectionRef:
    name: default
  spaceRef:
    name: corp
  nextAvailableFrom:
    rangeRef:
      name: lb-pool
  names:
    - name: svc-web.team-a
      type: user
  comment: Managed by uddi-operator
  tags:
    team: platform
