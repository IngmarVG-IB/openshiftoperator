# Hand-written minimal fixture, NOT copied from MetalLB: just enough of the
# ipaddresspools.metallb.io CRD (metallb.io/v1beta1 IPAddressPool, namespaced) for
# internal/metallb's envtest suite and the IPAllocationPolicy mirroring envtest. It mirrors
# the field names, types and defaults documented at https://metallb.io/apis/ (spec.addresses
# required, spec.autoAssign defaulting to true, spec.avoidBuggyIPs defaulting to false) so
# server-side defaulting behaves like a real cluster; spec.serviceAllocation and status are
# left open because this operator neither reads nor writes them.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ipaddresspools.metallb.io
spec:
  group: metallb.io
  names:
    kind: IPAddressPool
    listKind: IPAddressPoolList
    plural: ipaddresspools
    singular: ipaddresspool
  scope: Namespaced
  versions:
    - name: v1beta1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                addresses:
                  type: array
                  items:
                    type: string
                autoAssign:
                  type: boolean
                  default: true
                avoidBuggyIPs:
                  type: boolean
                  default: false
                serviceAllocation:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
              required:
                - addresses
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
