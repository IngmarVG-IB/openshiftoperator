# Hand-written minimal CRD for envtest. It is NOT the upstream Gateway API CRD: it declares
# only what internal/gatewayapi and the HTTPRoute source read (a namespaced Gateway in
# gateway.networking.k8s.io/v1 with a status subresource) and keeps spec and status as
# free-form objects. Field names were checked against the Gateway API reference at
# https://gateway-api.sigs.k8s.io/reference/api-spec/ (status.addresses[].type and .value).
#
# The group ends in .k8s.io, so the apiserver only accepts the CRD with an api-approved
# annotation; the "unapproved" form is for CRDs that are not part of the upstream API.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gateways.gateway.networking.k8s.io
  annotations:
    api-approved.kubernetes.io: "unapproved, hand-written minimal CRD for envtest"
spec:
  group: gateway.networking.k8s.io
  names:
    kind: Gateway
    listKind: GatewayList
    plural: gateways
    singular: gateway
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
