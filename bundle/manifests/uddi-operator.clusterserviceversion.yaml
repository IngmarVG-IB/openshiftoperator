  description: |-
    The Universal DDI Operator shims OpenShift to [Infoblox Universal
    DDI](https://www.infoblox.com/products/universal-ddi/), the cloud-delivered DNS, DHCP
    and IPAM platform behind the Infoblox Cloud Services Portal.

    ## Object layer

    Universal DDI objects are modelled one-to-one as namespaced custom resources under the
    `uddi.infoblox.com` API group, covering DNS (View, AuthZone, Record), IPAM (IPSpace,
    AddressBlock, Subnet, Range, Address) and DHCP (FixedAddress). Reconciling a custom
    resource creates, updates, adopts or deletes the matching object in Universal DDI, so a
    GitOps or `oc apply` workflow drives DNS records, IP allocation and DHCP reservations the
    same way it drives any other OpenShift object.

    ## Connections and credentials

    Every namespace that owns object-layer resources also owns a `Connection` custom
    resource, which points at a Secret holding the tenant's Universal DDI API key. This
    keeps credentials scoped per namespace/tenant rather than cluster-wide, so multiple
    teams or sandboxes can share a cluster safely.

    ## Ownership and lifecycle

    Objects created or adopted by the operator are tagged with the owning cluster, the
    owning custom resource and its Kubernetes UID. The operator only ever creates, modifies
    or deletes objects that carry its own ownership tags: pre-existing objects can be
    adopted explicitly (`lifecycle.adoptExisting: true`), and each object's
    `lifecycle.deletionPolicy` (`Delete`, the default, or `Orphan`) controls whether deleting
    the custom resource also deletes the underlying Universal DDI object.
