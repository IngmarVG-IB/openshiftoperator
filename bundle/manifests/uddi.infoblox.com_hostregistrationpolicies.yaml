                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the metadata.generation the status was last computed
                  from.
                format: int64
                type: integer
              pending:
                description: Pending is the number of registration objects that exist
                  but are not Ready.
                format: int32
                type: integer
              registered:
                description: Registered is the number of Nodes whose registration
                  object is Ready.
                format: int32
                type: integer
              skipped:
                description: |-
                  Skipped lists Nodes not registered, and why. Bounded and sorted by node then
                  reason.
                items:
                  description: |-
                    SkippedNode is one Node that was not registered, or not registered as desired, and
                    why. See internal/hostreg.Skip.
                  properties:
                    message:
                      description: Message is a human-readable explanation.
                      maxLength: 512
                      type: string
                    node:
                      description: Node is the name of the Node that was skipped.
                      maxLength: 253
                      type: string
                    reason:
                      description: Reason is a short machine-readable skip reason,
                        for example NoMAC.
                      maxLength: 64
                      type: string
                  type: object
                maxItems: 50
                type: array
                x-kubernetes-list-type: atomic
            type: object
