    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          HostRegistrationPolicy registers selected Nodes in Universal DDI as an IPAM Address
          or a DHCP FixedAddress.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              HostRegistrationPolicySpec selects which Nodes get registered in Universal DDI as an
              Address or a DHCP FixedAddress. See DESIGN.md section 4.7 for the full pipeline.
            properties:
              addressType:
                default: InternalIP
                description: AddressType selects which Node address is registered.
                enum:
                - InternalIP
                - ExternalIP
                type: string
              connectionRef:
                description: |-
                  ConnectionRef names the Connection used by every generated object. Empty means
                  the Connection called "default" in this namespace.
                properties:
                  name:
                    description: Name of the Connection in this namespace. Defaults
                      to "default".
                    maxLength: 253
                    type: string
                type: object
              lifecycle:
                description: Lifecycle is copied onto every generated object's spec.lifecycle.
                properties:
                  adoptExisting:
                    default: false
                    description: |-
                      AdoptExisting allows taking over an existing Universal DDI object that matches the
                      natural key but does not carry this operator's ownership tags. When false such an
                      object is reported as a conflict (Ready=False/AlreadyExists).
                    type: boolean
                  deletionPolicy:
                    default: Delete
                    description: DeletionPolicy decides whether deleting the CR also
                      deletes the Universal DDI object.
                    enum:
                    - Delete
                    - Orphan
                    type: string
                type: object
              macSource:
                description: MACSource selects where a Node's MAC address comes from.
                properties:
                  nmstate:
                    description: NMState controls reading NodeNetworkState for the
                      MAC.
                    properties:
                      enabled:
                        default: true
                        description: |-
                          Enabled reads NodeNetworkState when the nmstate.io/v1beta1 API is present on the
                          cluster.
                        type: boolean
                      interface:
                        description: |-
                          Interface names the NodeNetworkState interface to take the MAC from. Empty means
                          the interface whose addresses include the registered address.
                        maxLength: 256
                        type: string
                    type: object
                  nodeAnnotation:
                    default: uddi.infoblox.com/mac
                    description: |-
                      NodeAnnotation is the fully qualified annotation key holding the MAC. Defaults
                      to uddi.infoblox.com/mac.
                    maxLength: 317
                    pattern: ^(([A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?\.)*[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?/)?[A-Za-z0-9]([-A-Za-z0-9_.]*[A-Za-z0-9])?$
                    type: string
                type: object
              register:
                description: Register controls which kind of object is created for
                  each Node.
                properties:
                  dhcpOptions:
                    description: DHCPOptions are copied to every generated FixedAddress.
                      Ignored in Address mode.
                    items:
                      description: |-
                        DHCPOption maps to the Universal DDI ipam.OptionItem. Option groups are opaque
                        Universal DDI resource ids. An option code is named either by its Universal DDI
                        resource id (optionCode) or by its name (optionName), which the operator looks up in
                        Universal DDI, optionally narrowed to one option space (optionSpace).
                      properties:
                        group:
                          description: |-
                            Group is a Universal DDI option group id, for example "dhcp/option_group/<uuid>".
                            Required when type is "group".
                          maxLength: 256
                          type: string
                        optionCode:
                          description: |-
                            OptionCode is a Universal DDI option code id, for example "dhcp/option_code/<uuid>".
                            When type is "option", exactly one of optionCode and optionName is set.
                          maxLength: 256
                          type: string
                        optionName:
                          description: |-
                            OptionName is the name of a DHCP option code, for example "routers" or
                            "domain-name-servers", looked up in Universal DDI instead of giving the option
                            code id. A name that exists in more than one option space needs optionSpace; a
                            name that does not resolve keeps the object at Ready=False with reason
                            DependencyNotReady and is retried, so a code created later is picked up without
                            editing the object. When type is "option", exactly one of optionCode and
                            optionName is set.
                          maxLength: 128
                          minLength: 1
                          type: string
                        optionSpace:
                          description: |-
                            OptionSpace is the Universal DDI option space id, for example
                            "dhcp/option_space/<uuid>", that optionName is looked up in. It may only be set
                            together with optionName. Leave it out when the name exists in exactly one option
                            space.
                          maxLength: 256
                          minLength: 1
                          type: string
                        optionValue:
                          description: OptionValue is the value for the option code.
                          maxLength: 4096
                          type: string
                        type:
                          default: option
                          description: Type selects a single option or an option group.
                          enum:
                          - option
                          - group
                          type: string
                      required:
                      - type
                      type: object
                      x-kubernetes-validations:
                      - message: type option requires exactly one of optionCode and
                          optionName, type group requires group
                        rule: 'self.type == ''option'' ? has(self.optionCode) != has(self.optionName)
                          : has(self.group)'
                      - message: optionSpace may only be set together with optionName
                        rule: '!has(self.optionSpace) || has(self.optionName)'
                      - message: type group takes neither optionCode nor optionName
                        rule: self.type != 'group' || (!has(self.optionCode) && !has(self.optionName))
                    type: array
                    x-kubernetes-list-type: atomic
                  mode:
                    default: Auto
                    description: |-
                      Mode selects Address, FixedAddress, or Auto (FixedAddress when a MAC is known,
                      Address otherwise).
                    enum:
                    - Auto
                    - Address
                    - FixedAddress
                    type: string
                type: object
              selector:
                description: Selector selects the Nodes this policy considers. Empty
                  selects every Node.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              spaceRef:
                description: |-
                  SpaceRef names the IPSpace CR, in this namespace, that holds the Node addresses.
                  Only a name is accepted (not a raw Universal DDI id): the IPSpace CR must exist
                  so its status.id can be watched for readiness.
                properties:
                  id:
                    description: ID is a Universal DDI resource id, for example "dns/view/2c1a...".
                    maxLength: 256
                    type: string
                  name:
                    description: Name of an object-layer CR in this namespace.
                    maxLength: 253
                    type: string
                type: object
                x-kubernetes-validations:
                - message: spaceRef must set name
                  rule: size(self.name) > 0
                - message: exactly one of name or id must be set
                  rule: has(self.name) != has(self.id)
              tags:
                additionalProperties:
                  type: string
                description: Tags are merged into every generated object's spec.tags.
                type: object
            required:
            - spaceRef
            type: object
          status:
